# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Initialize python virtual environment
    cmds:
      - rm -rf ./.venv
      - uv sync --link-mode=copy

  run:
    desc: Run the app
    cmd: uv run main.py {{.CLI_ARGS}}"

  test:
    desc: Run the tests
    cmds:
      - uv run pytest -v --rootdir=.

  test-coverage:
    desc: Run the tests with coverage
    cmds:
      - uv run pytest --doctest-modules --cov=mindmap --cov-report=xml --cov-report=html

  lint:
    desc: Run the linter
    cmds:
      - uv run flake8
