# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  init:
    desc: Initialize node modules
    deps:
      - workspace:init
      - app:init

  workspace:init:
    desc: Initialize workspace dependencies
    cmds:
      - pnpm i
      - pnpm run prepare

  app:init:
    desc: Initialize app dependencies
    dir: app
    cmds:
      - pnpm i

  lint:
    desc: Run the linter
    cmds:
      - |
        pnpx markdownlint-cli \
        --ignore node_modules \
        --ignore well-architected \
        --ignore output \
        --ignore azure-docs \
        --ignore app \
        --ignore tests .

  run:
    desc: Generate the output
    cmds:
      - pnpx markmap-cli output/*.md -o output/index.html --offline --no-open

  clean:
    desc: Clean all node_modules directories
    cmds:
      - rm -rf **/node_modules
